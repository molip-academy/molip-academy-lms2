spring:
  application:
    name: back
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-0123456789abcdef}
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600
  cookie:
    same-site: ${COOKIE_SAME_SITE:Lax}
    secure: ${COOKIE_SECURE:false}
    # 비워 두면 쿠키가 발급한 호스트에만 묶인다. 프론트와 백엔드가 서브도메인으로
    # 갈리면 상위 도메인을 넣어야 XSRF-TOKEN 을 프론트에서 읽을 수 있다.
    domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API 문서는 기본적으로 꺼져 있다. dev와 test에서만 켠다.
# 배포 프로파일은 아무 설정을 하지 않아도 노출되지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 상태 확인용 엔드포인트. health 하나만 연다.
# env·beans·heapdump 같은 것들은 공개되면 설정값과 메모리 내용이 그대로 새어 나간다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 공개 엔드포인트라 상세는 감춘다. DB 종류·버전·디스크 용량까지 드러낼 이유가 없다.
      show-details: never
      show-components: never
