spring:
  application:
    name: back
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-0123456789abcdef}
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600
  cookie:
    same-site: ${COOKIE_SAME_SITE:Lax}
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API 문서는 기본적으로 꺼져 있다. dev와 test에서만 켠다.
# 배포 프로파일은 아무 설정을 하지 않아도 노출되지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
